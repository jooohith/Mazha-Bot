name: Check IMD Weather Forecast

on:
  schedule:
    # 🚨 Rush Hour (5:00 AM to 9:00 AM IST / 23:30 to 03:30 UTC):
    # Runs EVERY 15 MINUTES when holiday announcements and morning weather updates drop
    - cron: '*/15 23,0,1,2,3 * * *'

    # 🌤️ Rest of the Day (9:00 AM to 11:00 PM IST / 03:30 to 17:30 UTC):
    # Runs EVERY 1 HOUR to keep tabs on afternoon update shifts efficiently
    - cron: '0 4-17 * * *'

  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tracker Engine
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
